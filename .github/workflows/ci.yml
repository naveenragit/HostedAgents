name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Offline quality gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        id: python311
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Python 3.13
        id: python313
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://packagefeedproxy.microsoft.io/npm/

      - name: Bootstrap locked dependencies
        shell: pwsh
        env:
          HOSTED_AGENTS_PYTHON_311: ${{ steps.python311.outputs.python-path }}
          HOSTED_AGENTS_PYTHON_313: ${{ steps.python313.outputs.python-path }}
        run: ./scripts/bootstrap.ps1

      - name: Run shared quality gate
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            $failures += $errors | ForEach-Object { "$($script.Name): $($_.Message)" }
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }

  release-surface:
    name: History and artifact scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan complete Git history
        shell: bash
        run: gitleaks git --redact --no-banner --log-opts="--all" .

      - name: Build tracked-file archive
        shell: pwsh
        run: ./scripts/verify-release-artifact.ps1 -OutputPath "$env:RUNNER_TEMP/tracked.zip"

      - name: Scan extracted release surface
        shell: pwsh
        run: |
          $extractPath = Join-Path $env:RUNNER_TEMP 'tracked'
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP 'tracked.zip') -DestinationPath $extractPath
          & gitleaks dir --redact --no-banner $extractPath
          if ($LASTEXITCODE -ne 0) { throw "Gitleaks artifact scan failed with exit code $LASTEXITCODE" }