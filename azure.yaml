# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Two Microsoft Foundry hosted agents deployed into an EXISTING Foundry project.
#
#   research-agent  -> CONTAINER deploy (Dockerfile -> ACR -> agent version), Python 3.11
#   triage-agent    -> CODE deploy      (source ZIP, platform builds),        python_3_13
#
# EXISTING-PROJECT MODE
# ---------------------
# There is deliberately no `ai-project` service here. That service exists to CREATE a
# Foundry account, project and model deployments; against an existing project it would
# try to manage resources this repository does not own.
#
# Instead, point azd at the existing project and skip `azd provision` entirely:
#
#   azd env new dev
#   azd env set AZURE_SUBSCRIPTION_ID          "<subscription-guid>"
#   azd env set AZURE_LOCATION                 "<region>"
#   azd env set AZURE_AI_PROJECT_ENDPOINT      "https://<account>.services.ai.azure.com/api/projects/<project>"
#   azd env set AZURE_AI_PROJECT_ID            "<project-arm-resource-id>"
#   azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "<existing-model-deployment-name>"
#   azd deploy --no-prompt
#
# The deploying identity needs the **Foundry Project Manager** role at project scope.
# See docs/implementation-plan.md section 7.

name: hosted-agents

requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.7"

services:
  # ---------------------------------------------------------------------------
  # Agent 1 — CONTAINER deployment.
  # No `codeConfiguration` block => azd takes the container path and builds the
  # Dockerfile. `remoteBuild: true` makes ACR do the build, which guarantees a
  # linux/amd64 image (the platform rejects arm64) regardless of the dev host.
  # ---------------------------------------------------------------------------
  research-agent:
    host: azure.ai.agent
    project: backend/agents/research-agent
    language: python
    kind: hosted
    name: research-agent
    description: >-
      A research assistant that answers technical questions with concise, sourced
      explanations and explicitly flags anything it is not confident about.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      # Platform-injected FOUNDRY_* vars must NOT be declared here.
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # Routes model calls through the API Management AI gateway so token and
      # cost telemetry is attributed per user. Set with:
      #   azd env set APP_MODEL_GATEWAY_URL "https://<apim>.azure-api.net/<path>"
      # Leave unset to call the Foundry project directly.
      - name: APP_MODEL_GATEWAY_URL
        value: ${APP_MODEL_GATEWAY_URL}
      # Keeps prompts, completions, function arguments and system instructions OUT of
      # Application Insights. The repo's telemetry contract is metadata only.
      #
      # BOTH variables are required. ENABLE_SENSITIVE_DATA is the Agent Framework
      # switch; the Foundry hosted runtime instruments gen_ai itself and reads the
      # OpenTelemetry variable instead, defaulting content capture ON. Setting only
      # the first was verified to still export full prompts and completions into
      # AppDependencies, so the contract was unenforced.
      - name: ENABLE_SENSITIVE_DATA
        value: "false"
      - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        value: "false"
      - name: APP_LOG_LEVEL
        value: INFO
      - name: APP_MAX_INPUT_CHARS
        value: "8000"
    docker:
      path: Dockerfile
      remoteBuild: true
    container:
      resources:
        cpu: "1"
        memory: 2Gi

  # ---------------------------------------------------------------------------
  # Agent 2 — CODE deployment.
  # `codeConfiguration` present => azd zips backend/agents/triage-agent (honouring
  # .agentignore) and Foundry builds the runtime image server-side.
  # `runtime` MUST be python_3_13 or python_3_14 — 3.11 is not a valid value.
  # ---------------------------------------------------------------------------
  triage-agent:
    host: azure.ai.agent
    project: backend/agents/triage-agent
    language: python
    kind: hosted
    name: triage-agent
    description: >-
      A support-triage assistant that classifies an incoming customer issue by
      severity and product area, and proposes the next action for the on-call
      engineer.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # Routes model calls through the API Management AI gateway so token and
      # cost telemetry is attributed per user. Set with:
      #   azd env set APP_MODEL_GATEWAY_URL "https://<apim>.azure-api.net/<path>"
      # Leave unset to call the Foundry project directly.
      - name: APP_MODEL_GATEWAY_URL
        value: ${APP_MODEL_GATEWAY_URL}
      # Keeps prompts, completions, function arguments and system instructions OUT of
      # Application Insights. The repo's telemetry contract is metadata only.
      #
      # BOTH variables are required. ENABLE_SENSITIVE_DATA is the Agent Framework
      # switch; the Foundry hosted runtime instruments gen_ai itself and reads the
      # OpenTelemetry variable instead, defaulting content capture ON. Setting only
      # the first was verified to still export full prompts and completions into
      # AppDependencies, so the contract was unenforced.
      - name: ENABLE_SENSITIVE_DATA
        value: "false"
      - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        value: "false"
      - name: APP_LOG_LEVEL
        value: INFO
      - name: APP_MAX_INPUT_CHARS
        value: "8000"
    container:
      resources:
        cpu: "1"
        memory: 2Gi
